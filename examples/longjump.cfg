// Import in Settings > Import / export. This only changes supported preferences.
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "space" "+jump"
bind "mwheeldown" "+jump"
bind "ctrl" "+duck"
bind "shift" "+speed"

// Hold V to jump + duck and cancel forward/back; release, then duck before landing.
alias "+lj" "+duck; +jump; -forward; -back"
alias "-lj" "-duck; -jump"
bind "v" "+lj"

sensitivity "2.4"
m_yaw "0.022"
m_pitch "0.022"
viewmodel_presetpos "3"
cl_righthand "1"
cl_crosshairstyle "4"
cl_crosshairsize "3"
cl_crosshairgap "2"
cl_crosshairthickness "1"
cl_crosshaircolor "1"
